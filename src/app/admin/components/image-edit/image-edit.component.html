<div *ngFor="let key of imageKeys" class="row px-1 align-items-top">
  <ng-container *ngIf="key !== 'order'">
    <div class="col-2">
      <label class="w-100 montserrat d-inline-block">
        {{ key }}
      </label>
    </div>

    <div class="col">
      <app-input-field [tileNumber]="tileNumber" [imageNumber]="image.order" [key]="key" [obj]="image[key]" [type]="typeOf(image[key])">
      </app-input-field>
    </div>

    <div class="col-auto">
      <button class="btn btn-link" (click)="removeField(key)">x</button>
    </div>
  </ng-container>
</div>

<div class="mt-3 mx-1 d-flex flex-row flex-wrap" style="gap: .25rem .5rem">
  <button *ngFor="let field of unusedImageFields" type="btn" class="btn btn-outline-success" (click)="addField(field[0], field[1])">
    + {{ field[0] }}
  </button>
</div>

<button type="btn" class="mt-2 btn btn-link" (click)="deleteImage()">
  Delete Image
</button>
